components:
  requestBodies:
    AccountCredentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, format: password, minLength: 12 }
  securitySchemes:
    partnerToken:
      type: http
      scheme: bearer
      description: Dedicated server-side token for the partner named in the path.
    cashierSession:
      type: apiKey
      in: cookie
      name: idsc_finance_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: MongoDB document ID
      schema:
        type: string
      example: "REPLACE_WITH_MONGODB_OBJECT_ID"

    StudentId:
      name: studentId
      in: path
      required: true
      description: Student's school ID
      schema:
        type: string
      example: "2026-001"

  responses:
    BadRequest:
      description: Invalid input or validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://example.com/problems/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Please check the submitted data."

    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://example.com/problems/not-found"
            title: "Not Found"
            status: 404
            detail: "The requested resource was not found."

    ServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    DailyLedgerTotals:
      type: object
      required: [collectedMinor, reversedMinor, netMinor]
      properties:
        collectedMinor: { type: integer, description: Posted collections in centavos }
        reversedMinor: { type: integer, description: Approved reversals in centavos }
        netMinor: { type: integer, description: Collected minus reversed in centavos }
    DailyLedgerReport:
      type: object
      required: [date, timezone, totals, groups, rows]
      properties:
        date: { type: string, format: date }
        timezone: { type: string, example: Asia/Manila }
        totals:
          $ref: "#/components/schemas/DailyLedgerTotals"
        groups:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/DailyLedgerTotals"
              - type: object
                required: [postedBy, method]
                properties:
                  postedBy: { type: string }
                  method: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [paymentId, receiptNumber, postedBy, method, amountMinor, type, at]
            properties:
              paymentId: { type: string, format: uuid }
              receiptNumber: { type: string }
              postedBy: { type: string }
              decidedBy: { type: string, description: Approval actor for a reversal }
              method: { type: string }
              amountMinor: { type: integer }
              type: { type: string, enum: [collection, reversal] }
              at: { type: string, format: date-time }
    LedgerReceipt:
      type: object
      required: [_id, receiptNumber, status, studentId, studentName, term, charge, amountMinor, method, postedAt, postedBy, balanceAfterMinor, reversals]
      properties:
        _id: { type: string, format: uuid }
        receiptNumber: { type: string }
        status: { type: string, enum: [posted, reversed] }
        studentId: { type: string }
        studentName: { type: string }
        term: { type: string }
        charge: { type: string }
        amountMinor: { type: integer }
        balanceAfterMinor: { type: integer, description: Charge balance immediately after posting }
        method: { type: string, enum: [Cash, Bank Transfer, Online Payment, Other] }
        reference: { type: string }
        postedAt: { type: string, format: date-time }
        postedBy: { type: string }
        reversals:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              status: { type: string, enum: [pending, approved, rejected] }
              requestedAt: { type: string, format: date-time }
              requestedBy: { type: string }
              decidedAt: { type: string, format: date-time }
              decidedBy: { type: string }
              decisionNote: { type: string }
    Problem:
      type: object
      properties:
        type:
          type: string
          example: "https://example.com/problems/not-found"
        title:
          type: string
          example: "Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "The requested resource was not found."

    StudentInput:
      type: object
      required:
        - studentId
        - studentName
        - program
        - academicYear
      properties:
        studentId:
          type: string
          example: "2026-001"
        studentName:
          type: string
          example: "Juan Dela Cruz"
        program:
          type: string
          example: "BSIT"
        academicYear:
          type: string
          example: "2026-2027"
        semester:
          type: string
          example: "1st Semester"
        accountStatus:
          type: string
          enum: [Active, Inactive]
          example: Active

    Student:
      allOf:
        - $ref: "#/components/schemas/StudentInput"
        - type: object
          properties:
            _id:
              type: string
              example: "REPLACE_WITH_MONGODB_OBJECT_ID"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AssessmentInput:
      type: object
      required:
        - studentId
        - academicYear
        - semester
      properties:
        studentId:
          type: string
          example: "2026-001"
        academicYear:
          type: string
          example: "2026-2027"
        semester:
          type: string
          example: "1st Semester"
        tuitionFee:
          type: number
          minimum: 0
          example: 15000
        miscellaneousFee:
          type: number
          minimum: 0
          example: 2000
        laboratoryFee:
          type: number
          minimum: 0
          example: 1000
        registrationFee:
          type: number
          minimum: 0
          example: 500
        libraryFee:
          type: number
          minimum: 0
          example: 500
        otherFees:
          type: number
          minimum: 0
          example: 500
        discounts:
          type: number
          minimum: 0
          example: 0
        scholarshipFinancialAssistance:
          type: number
          minimum: 0
          example: 0
        totalAssessment:
          type: number
          example: 20000
        dueDate:
          type: string
          format: date
          example: "2026-11-30"
        assessmentStatus:
          type: string
          enum: [Unpaid, Partially Paid, Paid, Overdue]
          example: Unpaid

    Assessment:
      allOf:
        - $ref: "#/components/schemas/AssessmentInput"
        - type: object
          properties:
            _id:
              type: string
              example: "REPLACE_WITH_MONGODB_OBJECT_ID"

    PaymentInput:
      type: object
      required:
        - paymentId
        - studentId
        - amountPaid
        - paymentMethod
        - receiptNumber
      properties:
        paymentId:
          type: string
          example: "PAY-2026-001"
        studentId:
          type: string
          example: "2026-001"
        assessmentId:
          type: string
          description: MongoDB ID of the related assessment
          example: "REPLACE_WITH_ASSESSMENT_OBJECT_ID"
        amountPaid:
          type: number
          exclusiveMinimum: 0
          example: 5000
        paymentDate:
          type: string
          format: date
          example: "2026-10-15"
        paymentMethod:
          type: string
          enum: [Cash, Bank Transfer, Online Payment, Other]
          example: Cash
        referenceNumber:
          type: string
          example: "REF-001"
        receiptNumber:
          type: string
          example: "REC-2026-001"
        processedBy:
          type: string
          example: "Finance Staff"
        remarks:
          type: string
          example: "First payment"
        paymentStatus:
          type: string
          enum: [Paid, Partially Paid, Pending, Cancelled]
          example: Partially Paid

    Payment:
      allOf:
        - $ref: "#/components/schemas/PaymentInput"
        - type: object
          properties:
            _id:
              type: string
              example: "REPLACE_WITH_MONGODB_OBJECT_ID"

    ReceiptInput:
      type: object
      required:
        - receiptNumber
        - paymentId
        - studentId
        - amountPaid
      properties:
        receiptNumber:
          type: string
          example: "REC-2026-001"
        paymentId:
          type: string
          example: "PAY-2026-001"
        studentId:
          type: string
          example: "2026-001"
        studentName:
          type: string
          example: "Juan Dela Cruz"
        paymentDate:
          type: string
          format: date
          example: "2026-10-15"
        amountPaid:
          type: number
          minimum: 0
          example: 5000
        paymentMethod:
          type: string
          example: Cash
        referenceNumber:
          type: string
          example: "REF-001"
        previousBalance:
          type: number
          example: 20000
        remainingBalance:
          type: number
          example: 15000
        processedBy:
          type: string
          example: "Finance Staff"

    Receipt:
      allOf:
        - $ref: "#/components/schemas/ReceiptInput"
        - type: object
          properties:
            _id:
              type: string
              example: "REPLACE_WITH_MONGODB_OBJECT_ID"

    FinanceAccount:
      type: object
      properties:
        studentId:
          type: string
          example: "2026-001"
        studentName:
          type: string
          example: "Juan Dela Cruz"
        totalAssessment:
          type: number
          example: 19500
        totalPaid:
          type: number
          example: 5000
        outstandingBalance:
          type: number
          example: 14500
        accountStatus:
          type: string
          example: Partially Paid
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
