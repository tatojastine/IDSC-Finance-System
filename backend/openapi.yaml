openapi: 3.0.3

info:
  title: IDSC Finance Management System API
  version: 1.0.0
  description: |
    REST API for the IDSC School Finance Management System.
    Current finance transactions use /api/v1/ledger. Signed-in owners and cashiers
    can post payments; owners also manage charges, reversal decisions and partner
    submissions. Paths outside the ledger use the historical collections.
    The original assessment, payment and receipt paths are read-only.

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Ledger
  - name: Faculty payroll
  - name: Partner integrations
  - name: Account access
    description: First-run setup, cashier approval, and password recovery
  - name: Health
    description: API health check
  - name: Students
    description: Student management
  - name: Assessments
    description: Student financial assessments
  - name: Payments
    description: Student payments
  - name: Receipts
    description: Payment receipts
  - name: Finance
    description: Student finance information
  - name: Reports
    description: Finance reports

security:
  - cashierSession: []

paths:
  /api/v1/health:
    get:
      security: []
      tags: [Health]
      summary: Check API health
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/ready:
    get:
      tags: [Health]
      security: []
      summary: Check whether the API can reach MongoDB
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        "503": { description: Database unavailable }
  /api/v1/auth/setup:
    get:
      tags: [Account access]
      security: []
      summary: Check whether owner setup is required and how many cashier slots remain
      responses:
        "200":
          description: First-run status and available cashier slots
          content:
            application/json:
              schema:
                type: object
                required: [ownerRequired, cashierSlotsAvailable]
                properties:
                  ownerRequired: { type: boolean }
                  cashierSlotsAvailable: { type: integer, minimum: 0, maximum: 2 }
                  setupKeyRequired: { type: boolean, description: Present during first-time hosted setup }
    post:
      tags: [Account access]
      security: []
      summary: Create the sole owner during first-run setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                setupKey: { type: string, format: password, description: Required for hosted owner setup }
      responses:
        "201": { description: Owner created and recovery code issued }
        "403": { description: Incorrect or missing hosted setup key }
        "409": { description: Owner already exists or email is taken }
        "503": { description: The host has not configured its setup key }
  /api/v1/auth/register:
    post:
      tags: [Account access]
      security: []
      summary: Request a cashier account
      requestBody:
        $ref: "#/components/requestBodies/AccountCredentials"
      responses:
        "201": { description: Pending cashier created and recovery code issued }
        "400": { description: Invalid account details }
        "409": { description: Owner setup required, email taken, or cashier slots full }
        "429": { description: Too many attempts }
  /api/v1/auth/login:
    post:
      tags: [Account access]
      security: []
      summary: Sign in and set the Finance session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                remember: { type: boolean }
      responses:
        "200": { description: Owner or cashier signed in }
        "401": { description: Email or password is incorrect }
        "403": { description: Cashier pending or inactive }
        "429": { description: Too many attempts }
  /api/v1/auth/session:
    get:
      tags: [Account access]
      summary: Get the current account
      responses:
        "200": { description: Current account ID, email, role and status }
        "401": { description: Sign-in required }
  /api/v1/auth/logout:
    post:
      tags: [Account access]
      security: []
      summary: End the current Finance session
      responses:
        "204": { description: Signed out }

  /api/v1/auth/reset-password:
    post:
      tags: [Account access]
      security: []
      summary: Reset a password using an unused recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, recoveryCode]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                recoveryCode: { type: string, format: password }
      responses:
        "200": { description: Password reset and replacement recovery code issued }
        "400": { description: Invalid account details or recovery code }
  /api/v1/auth/recovery-code:
    post:
      tags: [Account access]
      summary: Replace the signed-in account's recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "200": { description: Replacement recovery code issued }
        "401": { description: Sign-in required or current password is incorrect }
  /api/v1/auth/cashiers:
    get:
      tags: [Account access]
      summary: List cashier accounts as owner
      responses:
        "200": { description: Cashier accounts and approval states }
        "403": { description: Owner role required }
  /api/v1/auth/cashiers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Account access]
      summary: Approve, deactivate or reactivate a cashier as owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, deactivate, activate] }
      responses:
        "200": { description: Cashier updated }
        "403": { description: Owner role required }
        "409": { description: Cashier status prevents the requested change }
    delete:
      tags: [Account access]
      summary: Delete a cashier and free the slot as owner
      responses:
        "204": { description: Cashier deleted }
        "403": { description: Owner role required }
        "404": { description: Cashier not found }

  /api/v1/ledger/enrollments:
    get:
      tags: [Ledger]
      summary: Search student enrollments by ID, name or term
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
    post:
      tags: [Ledger]
      summary: Create an enrollment (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, term, name, program]
              properties:
                studentId: { type: string }
                term: { type: string }
                name: { type: string }
                program: { type: string }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
  /api/v1/ledger/enrollments/{id}:
    get:
      tags: [Ledger]
      summary: Read the term ledger and balances
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
  /api/v1/ledger/charges:
    post:
      tags: [Ledger]
      summary: Create a charge (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId, label, reference, amountMinor]
              properties:
                enrollmentId: { type: string }
                label: { type: string }
                reference: { type: string }
                amountMinor: { type: integer }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
  /api/v1/ledger/payments:
    post:
      tags: [Ledger]
      summary: Post an idempotent payment to one charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chargeId, amountMinor, method, requestId]
              properties:
                chargeId: { type: string }
                amountMinor: { type: integer }
                method: { type: string }
                requestId: { type: string }
                reference: { type: string }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
  /api/v1/ledger/payments/{id}/receipt:
    get:
      tags: [Ledger]
      summary: Read a printable payment receipt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Receipt details used by the print view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerReceipt"
        "401": { description: Active Finance session required }
        "404": { description: Payment receipt not found }
  /api/v1/ledger/payments/{id}/reversals:
    post:
      tags: [Ledger]
      summary: Request a payment reversal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
  /api/v1/ledger/payments/{id}/reversal:
    patch:
      tags: [Ledger]
      summary: Approve or reject a reversal (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
                note: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
  /api/v1/ledger/reversals:
    get:
      tags: [Ledger]
      summary: List pending reversals (owner)
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
  /api/v1/ledger/reports/daily:
    get:
      tags: [Ledger]
      summary: Read daily totals and reversals by collector and payment method
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Daily totals, breakdown by collector and method, and individual entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLedgerReport"
        "400": { description: Missing or invalid business date }
        "401": { description: Session or partner token required }
  /api/v1/ledger/reports/daily.csv:
    get:
      tags: [Ledger]
      summary: Download the daily collections breakdown and totals
      description: Uses the same date and cashier visibility as the JSON daily report. Amounts in the CSV are in pesos.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV spreadsheet download
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename for the selected date
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400": { description: Missing or invalid business date }
        "401": { description: Active Finance session required }
  /api/v1/ledger/partner-items:
    get:
      tags: [Ledger]
      summary: Read the latest Inventory and Faculty submissions (owner)
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
  /api/v1/ledger/partner-items/{id}:
    patch:
      tags: [Ledger]
      summary: Review or settle a partner submission (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string }
                reference: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
  /api/v1/integrations/registrar/enrollments:
    post:
      tags: [Partner integrations]
      summary: Send a confirmed enrollment
      security:
        - partnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId, studentId, term, name, program]
              properties:
                externalId: { type: string }
                studentId: { type: string }
                term: { type: string }
                name: { type: string }
                program: { type: string }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/registrar/students/{studentId}/standing:
    get:
      tags: [Partner integrations]
      summary: Read an enrollment's finance standing
      security:
        - partnerToken: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string }
        - name: term
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/cashier/students/{studentId}/charges:
    get:
      tags: [Partner integrations]
      summary: Get charge IDs and outstanding amounts
      security:
        - partnerToken: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string }
        - name: term
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/cashier/payments:
    post:
      tags: [Partner integrations]
      summary: Post a payment and get its receipt reference
      security:
        - partnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chargeId, amountMinor, method, requestId, operatorRef]
              properties:
                chargeId: { type: string }
                amountMinor: { type: integer }
                method: { type: string }
                requestId: { type: string }
                operatorRef: { type: string }
                reference: { type: string }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/library/fines:
    post:
      tags: [Partner integrations]
      summary: Submit an approved library fine
      security:
        - partnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, term, reference, label, amountMinor]
              properties:
                studentId: { type: string }
                term: { type: string }
                reference: { type: string }
                label: { type: string }
                amountMinor: { type: integer }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/library/fines/{reference}:
    get:
      tags: [Partner integrations]
      summary: Read the settlement of one library fine
      security:
        - partnerToken: []
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/inventory/payables:
    post:
      tags: [Partner integrations]
      summary: Submit an approved order and goods received for review
      security:
        - partnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId, approvedOrderRef, receivingRef, vendorRef, items]
              properties:
                externalId: { type: string }
                approvedOrderRef: { type: string }
                receivingRef: { type: string }
                vendorRef: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [itemRef, quantity, unitCostMinor]
                    properties:
                      itemRef: { type: string }
                      quantity: { type: integer }
                      unitCostMinor: { type: integer }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/inventory/payables/{reference}:
    get:
      tags: [Partner integrations]
      summary: Read the status of an Inventory payable
      security:
        - partnerToken: []
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/faculty/workloads:
    post:
      tags: [Partner integrations]
      summary: Submit approved teaching workload
      security:
        - partnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId, employeeRef, period, approvedHoursHundredths]
              properties:
                externalId: { type: string }
                employeeRef: { type: string }
                period: { type: string }
                approvedHoursHundredths: { type: integer }
      responses:
        "201": { description: Success }
        "401": { description: Session or partner token required }
        "200": { description: Previously accepted request }
        "400": { description: Invalid request }
        "409": { description: Record or state conflict }
        "503": { description: Integration token is not configured }
  /api/v1/integrations/faculty/workloads/{reference}:
    get:
      tags: [Partner integrations]
      summary: Read the review status of an approved workload
      security:
        - partnerToken: []
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "401": { description: Session or partner token required }
        "503": { description: Integration token is not configured }

  /api/v1/payroll/runs:
    get:
      tags: [Faculty payroll]
      summary: List payroll runs (owner)
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer }
        - name: period
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
    post:
      tags: [Faculty payroll]
      summary: Create a draft for one payroll period (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string }
      responses:
        "201": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "409": { description: Record or state conflict }
  /api/v1/payroll/runs/{id}:
    get:
      tags: [Faculty payroll]
      summary: Read payroll lines, totals and status (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "404": { description: Run or line unavailable }
  /api/v1/payroll/runs/{id}/workloads:
    get:
      tags: [Faculty payroll]
      summary: List reviewed workloads and available Personnel rates (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "404": { description: Run or line unavailable }
    post:
      tags: [Faculty payroll]
      summary: Record workload already approved outside the Faculty API (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeRef, reference, approvalRef, approvedHoursHundredths]
              properties:
                employeeRef: { type: string }
                reference: { type: string }
                approvalRef: { type: string }
                approvedHoursHundredths: { type: integer }
      responses:
        "201": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "404": { description: Run or line unavailable }
        "409": { description: Record or state conflict }
  /api/v1/payroll/runs/{id}/lines:
    put:
      tags: [Faculty payroll]
      summary: Save a draft faculty pay calculation (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workloadId, revision]
              properties:
                workloadId: { type: string }
                revision: { type: integer }
                lineId: { type: string }
                displayName: { type: string }
                hourlyRateMinor: { type: integer }
                rateApprovalRef: { type: string }
                additionsMinor: { type: integer }
                additionNote: { type: string }
                deductionsMinor: { type: integer }
                deductionNote: { type: string }
      responses:
        "200": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "404": { description: Run or line unavailable }
        "409": { description: Record or state conflict }
  /api/v1/payroll/runs/{id}/lines/{lineId}:
    delete:
      tags: [Faculty payroll]
      summary: Remove a draft payroll line (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: lineId
          in: path
          required: true
          schema: { type: string }
        - name: revision
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "404": { description: Run or line unavailable }
        "409": { description: Record or state conflict }
  /api/v1/payroll/runs/{id}/finalize:
    post:
      tags: [Faculty payroll]
      summary: Lock a payroll run for disbursement and reporting (owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer }
      responses:
        "200": { description: Success }
        "400": { description: Invalid input }
        "401": { description: Owner session or the specific partner token is required }
        "403": { description: Owner access required }
        "404": { description: Run or line unavailable }
        "409": { description: Record or state conflict }
